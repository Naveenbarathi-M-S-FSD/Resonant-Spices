<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Carousel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #111; }

    .carousel {
      position: relative;
      width: 600px;
      height: 350px;
      overflow: hidden;
      border-radius: 10px;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      animation: slide 20s infinite;
    }

    .slides img {
      width: 600px;
      height: 350px;
      object-fit: cover;
    }

    @keyframes slide {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(0); }
      25%  { transform: translateX(-600px); }
      45%  { transform: translateX(-600px); }
      50%  { transform: translateX(-1200px); }
      70%  { transform: translateX(-1200px); }
      75%  { transform: translateX(-1800px); }
      95%  { transform: translateX(-1800px); }
      100% { transform: translateX(0); }
    }

    .controls {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .controls span {
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .controls span:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="carousel">
    <div class="slides">
      <img src="https://picsum.photos/id/1015/600/350" alt="Slide 1">
      <img src="https://picsum.photos/id/1016/600/350" alt="Slide 2">
      <img src="https://picsum.photos/id/1018/600/350" alt="Slide 3">
      <img src="https://picsum.photos/id/1020/600/350" alt="Slide 4">
    </div>
    <div class="controls">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</body>
</html>
